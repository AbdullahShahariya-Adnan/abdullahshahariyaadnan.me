
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      Abdullah Shahariya Adnan | Software Developer & Portfolio
    </title>

    <meta
      name="description"
      content="Explore the official portfolio of Abdullah Shahariya Adnan, a Computer Science student and full-stack developer interested in software development, web technologies, and cybersecurity. Discover projects, skills, and blogs."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta name="author" content="Abdullah Shahariya Adnan" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.abdullahshahariyaadnan.me/"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph: Facebook, LinkedIn, WhatsApp -->
    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="Abdullah Shahariya Adnan"
    />

    <meta
      property="og:title"
      content="Abdullah Shahariya Adnan | Software Developer"
    />

    <meta
      property="og:description"
      content="Explore the portfolio, projects, technical skills, and blogs of Abdullah Shahariya Adnan, a Computer Science student and full-stack developer."
    />

    <meta
      property="og:url"
      content="https://www.abdullahshahariyaadnan.me/"
    />

    <meta
      property="og:image"
      content="https://www.abdullahshahariyaadnan.me/adnan-photo.webp"
    />

    <meta
      property="og:image:alt"
      content="Abdullah Shahariya Adnan"
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Abdullah Shahariya Adnan | Software Developer"
    />

    <meta
      name="twitter:description"
      content="Explore my software development projects, technical skills, and cybersecurity journey."
    />

    <meta
      name="twitter:image"
      content="https://www.abdullahshahariyaadnan.me/adnan-photo.webp"
    />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Abdullah Shahariya Adnan",
        "url": "https://www.abdullahshahariyaadnan.me/",
        "image": "https://www.abdullahshahariyaadnan.me/adnan-photo.webp",
        "description": "Computer Science student and full-stack developer interested in software development, web technologies, and cybersecurity.",
        "jobTitle": "Software Developer",
        "knowsAbout": [
          "Software Development",
          "Full-Stack Web Development",
          "React",
          "JavaScript",
          "Python",
          "SQL",
          "Cybersecurity"
        ]
      }
    </script>

    <!-- Structured Data: Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Abdullah Shahariya Adnan | Portfolio",
        "url": "https://www.abdullahshahariyaadnan.me/",
        "description": "Personal portfolio of Abdullah Shahariya Adnan featuring software development projects, skills, and blogs.",
        "inLanguage": "en"
      }
    </script>

    <!-- Preload Hero Image -->
    <link
      rel="preload"
      as="image"
      href="/adnan-photo.webp"
      fetchpriority="high"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Preload Google Fonts stylesheet -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Load fonts without blocking initial rendering -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
