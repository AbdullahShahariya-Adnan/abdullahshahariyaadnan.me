
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adnan | Software Developer</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adnan | Software Developer" />
    <meta
      property="og:description"
      content="Computer Science student, full-stack developer and cybersecurity learner."
    />

    <meta name="twitter:card" content="summary" />
    <meta
      name="description"
      content="Computer Science student, aspiring cybersecurity professional, and full-stack developer."
    />

    <!-- Load the hero image as early as possible -->
    <link
      rel="preload"
      as="image"
      href="/adnan-photo.webp"
      fetchpriority="high"
    />

    <!-- Connect early to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Preload Google Fonts stylesheet -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Load fonts without blocking initial rendering -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
